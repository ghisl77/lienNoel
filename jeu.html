<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trouve ghichain 🐻</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --wall-top: #f5c6e0;
      --wall-bot: #f0afd4;
      --floor-top: #c9956a;
      --floor-bot: #a87850;
      --pink: #e8527a;
      --dark-pink: #c2185b;
      --cream: #fff5f8;
      --purple: #c77dff;
      --gold: #ffd700;
      --text-dark: #4a1a30;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #1a0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ========== ÉCRAN INTRO ========== */
    #intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px 24px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      animation: fadeIn .6s ease;
    }

    .intro-bear {
      width: 140px;
      height: 140px;
      animation: bearIntro 2.5s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(255, 130, 170, .5));
    }

    @keyframes bearIntro {

      0%,
      100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-14px) rotate(3deg);
      }
    }

    #intro h1 {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      color: #ffc0cb;
      text-shadow: 0 0 30px rgba(255, 130, 170, .7), 0 2px 0 rgba(150, 0, 60, .3);
      line-height: 1.3;
    }

    #intro p {
      color: #f9a8d4;
      font-size: clamp(.95rem, 3vw, 1.15rem);
      max-width: 320px;
      line-height: 1.65;
    }

    .play-btn {
      margin-top: 6px;
      padding: 17px 52px;
      font-size: 1.15rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #ff4d7a 0%, #c2185b 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 32px rgba(232, 80, 130, .55);
      transition: transform .2s, box-shadow .2s;
      letter-spacing: .8px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .play-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .2) 0%, transparent 100%);
      border-radius: 50px;
    }

    .play-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(232, 80, 130, .65);
    }

    .play-btn:active {
      transform: scale(.97);
    }

    /* Petites étoiles décoratives intro */
    .intro-stars {
      font-size: 1.5rem;
      letter-spacing: 10px;
      opacity: .6;
      animation: twinkleAll 2s ease-in-out infinite;
    }

    @keyframes twinkleAll {

      0%,
      100% {
        opacity: .4;
      }

      50% {
        opacity: .8;
      }
    }

    /* ========== ÉCRAN DE JEU ========== */
    #game {
      display: none;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Header du jeu */
    #game-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(15, 3, 10, .82);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 182, 193, .2);
    }

    .header-title {
      font-family: 'Pacifico', cursive;
      font-size: 1.1rem;
      color: #ffc0cb;
      text-shadow: 0 0 12px rgba(255, 140, 170, .5);
    }

    #hint-btn {
      background: rgba(255, 182, 193, .15);
      border: 1.5px solid rgba(255, 182, 193, .4);
      color: #ffc0cb;
      padding: 7px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      transition: background .3s, transform .2s;
      touch-action: manipulation;
    }

    #hint-btn:hover {
      background: rgba(255, 182, 193, .3);
    }

    #hint-btn:active {
      transform: scale(.95);
    }

    /* Toast indice */
    #hint-toast {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(255, 78, 120, .92), rgba(194, 24, 91, .92));
      color: white;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: .95rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
      opacity: 0;
      transition: opacity .4s;
      z-index: 60;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }

    #hint-toast.show {
      opacity: 1;
    }

    /* ========== LA CHAMBRE ========== */
    .room {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* --- MUR --- */
    .wall {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: linear-gradient(180deg, #fad5e8 0%, #f0b8d4 100%);
      overflow: hidden;
    }

    /* Papier-peint fleuri */
    .wall-pattern {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 25%, rgba(255, 80, 140, .18) 22px, transparent 23px),
        radial-gradient(circle at 12% 25%, rgba(255, 255, 255, .25) 14px, transparent 15px),
        radial-gradient(circle at 37% 10%, rgba(255, 80, 140, .18) 22px, transparent 23px),
        radial-gradient(circle at 37% 10%, rgba(255, 255, 255, .25) 14px, transparent 15px),
        radial-gradient(circle at 63% 28%, rgba(199, 125, 255, .2) 22px, transparent 23px),
        radial-gradient(circle at 63% 28%, rgba(255, 255, 255, .25) 14px, transparent 15px),
        radial-gradient(circle at 88% 12%, rgba(255, 80, 140, .18) 22px, transparent 23px),
        radial-gradient(circle at 88% 12%, rgba(255, 255, 255, .25) 14px, transparent 15px),
        radial-gradient(circle at 25% 60%, rgba(255, 80, 140, .18) 22px, transparent 23px),
        radial-gradient(circle at 25% 60%, rgba(255, 255, 255, .25) 14px, transparent 15px),
        radial-gradient(circle at 75% 70%, rgba(199, 125, 255, .2) 22px, transparent 23px),
        radial-gradient(circle at 75% 70%, rgba(255, 255, 255, .25) 14px, transparent 15px),
        radial-gradient(circle at 50% 45%, rgba(255, 80, 140, .18) 22px, transparent 23px),
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, .25) 14px, transparent 15px);
      background-size: 200px 180px;
    }

    /* Plinthe */
    .skirting {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 16px;
      background: linear-gradient(180deg, #d4a5b5, #c090a0);
      border-top: 2px solid rgba(255, 220, 235, .6);
    }

    /* --- PARQUET --- */
    .floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35%;
      background: linear-gradient(180deg, #c9956a 0%, #a87850 100%);
    }

    .floor-boards {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(90deg, transparent 0px, transparent 59px, rgba(0, 0, 0, .07) 59px, rgba(0, 0, 0, .07) 63px),
        repeating-linear-gradient(180deg, transparent 0px, transparent 29px, rgba(0, 0, 0, .04) 29px, rgba(0, 0, 0, .04) 32px);
    }

    .floor-shine {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(180deg, rgba(255, 220, 170, .35), transparent);
    }

    /* ========== FENÊTRE ========== */
    .window {
      position: absolute;
      top: 6%;
      left: 4%;
      width: min(140px, 32vw);
      aspect-ratio: 0.8 / 1;
      background: linear-gradient(160deg, #0d1b4e 0%, #1a2d7c 50%, #2d1f6e 100%);
      border: 7px solid #d4b0c0;
      border-radius: 10px 10px 4px 4px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .4);
      overflow: hidden;
    }

    /* Croix */
    .win-cross-v {
      position: absolute;
      top: 0;
      left: 50%;
      width: 5px;
      height: 100%;
      background: rgba(212, 176, 192, .65);
      transform: translateX(-50%);
    }

    .win-cross-h {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 5px;
      background: rgba(212, 176, 192, .65);
      transform: translateY(-50%);
    }

    /* Étoiles dans la fenêtre */
    .win-star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from {
        opacity: .2;
      }

      to {
        opacity: 1;
      }
    }

    /* Lune */
    .moon {
      position: absolute;
      top: 8%;
      right: 12%;
      width: min(26px, 6vw);
      height: min(26px, 6vw);
      background: #ffd966;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(255, 217, 102, .9);
    }

    .moon::after {
      content: '';
      position: absolute;
      top: -3px;
      right: -4px;
      width: 82%;
      height: 82%;
      background: #1a2d7c;
      border-radius: 50%;
    }

    /* Rideaux */
    .curtain {
      position: absolute;
      top: -4px;
      width: min(44px, 10vw);
      height: 110%;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
    }

    .curtain-l {
      left: -8px;
      background: linear-gradient(180deg, #e878a8 0%, #d04888 100%);
      transform-origin: top left;
      transform: skewX(7deg);
    }

    .curtain-r {
      right: -8px;
      background: linear-gradient(180deg, #e878a8 0%, #d04888 100%);
      transform-origin: top right;
      transform: skewX(-7deg);
    }

    /* Reflet lumière */
    .win-light {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 30%, rgba(100, 130, 255, .15) 0%, transparent 70%);
    }

    /* ========== GUIRLANDE LUMINEUSE MUR ========== */
    .fairy-lights {
      position: absolute;
      top: 8%;
      left: 36%;
      right: 2%;
      height: 30px;
      pointer-events: none;
    }

    .fairy-lights svg {
      width: 100%;
      height: 30px;
    }

    /* ========== PHOTOS AU MUR ========== */
    .wall-photo {
      position: absolute;
      background: white;
      padding: 4px 4px 16px 4px;
      box-shadow: 2px 4px 12px rgba(0, 0, 0, .3);
      border-radius: 2px;
    }

    .wall-photo .ph-inner {
      background: linear-gradient(135deg, #f8bbd0, #fce4ec);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      width: 100%;
      height: 100%;
    }

    .ph1 {
      width: min(62px, 14vw);
      height: min(72px, 16vw);
      top: 7%;
      left: 36%;
      transform: rotate(-5deg);
    }

    .ph2 {
      width: min(55px, 12vw);
      height: min(65px, 14vw);
      top: 5%;
      left: 52%;
      transform: rotate(3deg);
    }

    /* Cœur décoratif mur */
    .wall-heart {
      position: absolute;
      top: 7%;
      left: 70%;
      font-size: clamp(.9rem, 3vw, 1.3rem);
      opacity: .4;
      animation: pulseH 2.2s ease-in-out infinite;
    }

    @keyframes pulseH {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }

    /* ========== BIBLIOTHÈQUE ========== */
    .bookshelf {
      position: absolute;
      right: 3%;
      top: 4%;
      width: min(110px, 26vw);
    }

    .shelf-row {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 0 3px;
    }

    .shelf-plank {
      width: 100%;
      height: 9px;
      background: linear-gradient(180deg, #9b6840, #7a5030);
      border-radius: 2px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, .35);
      margin-bottom: 2px;
    }

    .bk {
      border-radius: 2px 2px 0 0;
      flex-shrink: 0;
    }

    /* ========== TAPIS ========== */
    .rug {
      position: absolute;
      bottom: 35%;
      left: 50%;
      transform: translateX(-50%);
      width: min(380px, 80%);
      height: min(28px, 5vw);
      background: radial-gradient(ellipse, #c2185b 60%, #880e4f 100%);
      border-radius: 50%;
      opacity: .55;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    }

    /* ========== LIT ========== */
    .bed {
      position: absolute;
      bottom: 35%;
      left: 50%;
      transform: translateX(-50%);
      width: min(380px, 86%);
    }

    /* Tête de lit */
    .bed-head {
      width: 94%;
      margin: 0 auto;
      height: min(72px, 15vw);
      background: linear-gradient(180deg, #f0c0d8 0%, #d898b8 100%);
      border-radius: 14px 14px 0 0;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 -4px 14px rgba(0, 0, 0, .2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .bed-head-ornament {
      width: min(22px, 5vw);
      height: min(22px, 5vw);
      background: radial-gradient(circle, #ffd700 30%, #f0a820 100%);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 215, 0, .6);
    }

    .heart-deco {
      font-size: clamp(.9rem, 3vw, 1.5rem);
      opacity: .65;
    }

    /* Matelas */
    .mattress {
      width: 100%;
      height: min(100px, 22vw);
      background: linear-gradient(180deg, #faeaf4 0%, #f2d5e8 100%);
      border-radius: 6px;
      position: relative;
      box-shadow: 0 6px 22px rgba(0, 0, 0, .28);
    }

    /* Oreillers */
    .pillows {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 0 12px;
    }

    .pillow {
      flex: 1;
      height: min(38px, 9vw);
      background: linear-gradient(160deg, #fff5f8, #fce4ec);
      border-radius: 7px;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .1), 0 2px 7px rgba(0, 0, 0, .15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(.7rem, 2.5vw, 1rem);
    }

    /* Couverture */
    .blanket-fold {
      position: absolute;
      bottom: 48px;
      left: 0;
      right: 0;
      height: 18px;
      background: linear-gradient(180deg, #f8bbd0, #f48fb1);
      border-radius: 4px;
    }

    .blanket {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: linear-gradient(135deg, #c2185b 0%, #e91e63 40%, #c2185b 100%);
      border-radius: 0 0 6px 6px;
    }

    .blanket::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 12px,
          rgba(255, 255, 255, .09) 12px, rgba(255, 255, 255, .09) 14px);
      border-radius: inherit;
    }

    /* Petits cœurs sur la couverture */
    .blanket-hearts {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: .35;
      font-size: clamp(.7rem, 2.5vw, 1rem);
    }

    /* ===== NOUNOURS SVG CACHÉ ===== */
    #teddy-wrapper {
      position: absolute;
      bottom: 4px;
      right: 5px;
      width: min(50px, 11vw);
      height: min(50px, 11vw);
      cursor: pointer;
      z-index: 20;
      /* Seulement ~18% du sommet de la tête dépasse — très bien caché ! */
      clip-path: inset(0 0 80% 0);
      animation: teddyHide 5s ease-in-out infinite;
      /* Légèrement assombri et desaturé pour se fondre dans l'oreiller */
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .7)) brightness(0.78) saturate(0.6);
      transition: clip-path .35s ease, transform .35s ease, filter .35s ease;
      user-select: none;
      touch-action: manipulation;
    }

    #teddy-wrapper:hover,
    #teddy-wrapper:active {
      clip-path: none;
      animation: none;
      transform: scale(1.3) rotate(-8deg);
      filter: drop-shadow(0 0 16px rgba(255, 180, 100, .95)) brightness(1) saturate(1);
    }

    @keyframes teddyHide {

      0%,
      100% {
        transform: rotate(-2deg) translateY(0);
      }

      50% {
        transform: rotate(2deg) translateY(-2px);
      }
    }

    /* ========== BUREAU ========== */
    .desk {
      position: absolute;
      bottom: 35%;
      left: 3%;
      width: min(115px, 28vw);
    }

    .desk-surface {
      width: 100%;
      height: min(13px, 3vw);
      background: linear-gradient(180deg, #b07045, #8B5532);
      border-radius: 5px 5px 0 0;
      box-shadow: 0 -4px 0 rgba(255, 255, 255, .08);
    }

    .desk-body {
      width: 88%;
      margin: 0 auto;
      height: min(60px, 14vw);
      background: linear-gradient(180deg, #9a6040, #7a4a30);
      border-radius: 0 0 4px 4px;
    }

    /* Lampe */
    .lamp {
      position: absolute;
      bottom: min(13px, 3vw);
      left: 16px;
    }

    .lamp-pole {
      width: 4px;
      height: min(38px, 9vw);
      background: linear-gradient(180deg, #9e9e9e, #616161);
      margin: 0 auto;
    }

    .lamp-head {
      width: min(30px, 7vw);
      height: min(18px, 4vw);
      background: linear-gradient(135deg, #fdd835, #f9a825);
      border-radius: 50% 50% 30% 30%;
      margin: 0 auto -2px auto;
      box-shadow: 0 0 18px rgba(255, 220, 50, .8), 0 0 40px rgba(255, 220, 50, .3);
    }

    /* Cône de lumière lampe */
    .lamp-beam {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: min(18px, 4vw) solid transparent;
      border-right: min(18px, 4vw) solid transparent;
      border-top: min(30px, 7vw) solid rgba(255, 220, 80, .12);
    }

    /* Tasse */
    .mug {
      position: absolute;
      bottom: min(13px, 3vw);
      right: 10px;
      width: min(18px, 4.5vw);
      height: min(22px, 5vw);
      background: linear-gradient(180deg, #ff7fab, #e91e63);
      border-radius: 3px 3px 5px 5px;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, .3);
    }

    .mug::after {
      content: '';
      position: absolute;
      right: -min(8px, 2vw);
      top: 30%;
      width: min(8px, 2vw);
      height: min(10px, 2.5vw);
      border: 2.5px solid #e91e63;
      border-left: none;
      border-radius: 0 4px 4px 0;
    }

    /* ========== PLANTE ========== */
    .plant {
      position: absolute;
      bottom: 35%;
      right: 3%;
    }

    .plant-pot {
      width: min(32px, 7.5vw);
      height: min(28px, 6.5vw);
      background: linear-gradient(180deg, #bf8040, #906030);
      border-radius: 3px 3px 7px 7px;
      margin: 0 auto;
    }

    .plant-leaves {
      position: absolute;
      bottom: min(22px, 5vw);
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .25));
      white-space: nowrap;
    }

    /* ========== HORLOGE MUR ========== */
    .clock {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: min(40px, 9vw);
      height: min(40px, 9vw);
      background: linear-gradient(135deg, #fff8f0, #ffe0c0);
      border: min(3px, 1vw) solid #c8906a;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock-hand-h,
    .clock-hand-m {
      position: absolute;
      bottom: 50%;
      left: 50%;
      width: 2px;
      transform-origin: bottom center;
      background: #5a3020;
      border-radius: 2px;
    }

    .clock-hand-h {
      height: 28%;
      transform: translateX(-50%) rotate(30deg);
    }

    .clock-hand-m {
      height: 38%;
      transform: translateX(-50%) rotate(150deg);
    }

    .clock-dot {
      width: 4px;
      height: 4px;
      background: #5a3020;
      border-radius: 50%;
    }

    /* ========== CANVAS CŒURS ========== */
    #heart-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
      display: none;
    }

    /* ========== MODAL VICTOIRE ========== */
    #win-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 0, 8, .78);
      z-index: 150;

    // ===== NOUNOURS TROUVÉ =====
    function foundTeddy() {
      document.getElementById('win-overlay').classList.add('show');
      const canvas = document.getElementById('heart-canvas');
      canvas.style.display = 'block';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      launchHearts(canvas);
    }

    function closeWin() {
      document.getElementById('win-overlay').classList.remove('show');
      document.getElementById('heart-canvas').style.display = 'none';
      heartsRunning = false;
    }

    // ===== PLUIE DE CŒURS =====
    let heartsRunning = false;
    const heartChars = ['❤️', '💕', '💖', '💗', '💓', '🌸', '✨', '🌹'];

    function launchHearts(canvas) {
      const ctx = canvas.getContext('2d');
      heartsRunning = true;

      const particles = Array.from({ length: 70 }, () => ({
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * 200,
        emoji: heartChars[Math.floor(Math.random() * heartChars.length)],
        size: Math.random() * 26 + 14,
        speed: Math.random() * 3.5 + 1.5,
        drift: Math.random() * 2 - 1,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - .5) * .09,
      }));

      (function draw() {
        if (!heartsRunning) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y -= p.speed;
          p.x += p.drift;
          p.rotation += p.rotSpeed;
          if (p.y < -60) { p.y = canvas.height + 20; p.x = Math.random() * canvas.width; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.font = `${p.size}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.emoji, 0, 0);
          ctx.restore();
        });
        requestAnimationFrame(draw);
      })();
    }

    window.addEventListener('resize', () => {
      const c = document.getElementById('heart-canvas');
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    });
